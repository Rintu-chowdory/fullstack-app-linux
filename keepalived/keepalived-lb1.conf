# /etc/keepalived/keepalived.conf on lb1 (MASTER, 192.168.1.11)
global_defs {
    router_id LB1
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep haproxy"
    interval 2
    weight 0
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface ens18            # adjust to your NIC (ip -o link show)
    virtual_router_id 51
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ChangeMeVrrp  # change this shared secret
    }
    virtual_ipaddress {
        192.168.1.13/24        # the VIP clients connect to
    }
    track_script {
        chk_haproxy
    }
}
