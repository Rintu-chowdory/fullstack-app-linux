# /etc/keepalived/keepalived.conf on lb2 (BACKUP, 192.168.1.12)
global_defs {
    router_id LB2
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep haproxy"
    interval 2
    weight 0
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface ens18            # adjust to your NIC
    virtual_router_id 51
    priority 100               # lower than lb1
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ChangeMeVrrp # must match lb1
    }
    virtual_ipaddress {
        192.168.1.13/24
    }
    track_script {
        chk_haproxy
    }
}
