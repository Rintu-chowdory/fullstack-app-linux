version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: dipti-db
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dipti_portal}
      MYSQL_USER: ${MYSQL_USER:-dipti}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dipti-backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      TZ: Europe/Berlin
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-dipti}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-dipti_portal}
      JWT_SECRET: ${JWT_SECRET:?set a strong random JWT_SECRET in .env}
      # Optional: fixed admin password (a random one is generated and printed otherwise)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dipti-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      TZ: Europe/Berlin
      PORT: 3000
      BACKEND_API_BASE_URL: http://backend:8000
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
