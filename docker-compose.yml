# Dev stack: single MariaDB + single app pair, with a one-shot migration service.
# Copy .env.example to .env and set real secrets before running.
name: dipti-dev

services:
  db:
    image: mariadb:10.11
    container_name: dipti-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dipti_portal
      MYSQL_USER: dipti
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dipti
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_NAME: dipti_portal
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dipti-backend
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dipti
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_NAME: dipti_portal
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dipti-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_API_BASE_URL: http://backend:8000
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: dipti
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_NAME: dipti_portal
      COOKIE_SECURE: "0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
