# Keepalived — lb2 (192.168.1.12), BACKUP for VIP 192.168.1.13
# Install: sudo cp haproxy/keepalived-lb2.conf /etc/keepalived/keepalived.conf
# Adjust `interface` to your actual NIC (ip link): eth0, ens33, ens160, ...

global_defs {
    router_id lb2
}

# Fail over if the local haproxy process dies (VIP moves to lb2)
vrrp_script chk_haproxy {
    script "killall -0 haproxy"
    interval 2
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface ens33
    virtual_router_id 51
    priority 99
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1111
    }
    virtual_ipaddress {
        192.168.1.13/24
    }
    track_script {
        chk_haproxy
    }
}
