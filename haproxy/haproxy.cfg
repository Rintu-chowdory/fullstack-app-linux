# HAProxy load balancer — deploy identically to lb1 (192.168.1.11) and lb2 (192.168.1.12).
# The shared VIP 192.168.1.13 is managed by keepalived (see keepalived-lb1.conf / keepalived-lb2.conf).
#
# Install:  sudo cp haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg
# Cert:     sudo mkdir -p /etc/haproxy/certs
#           sudo openssl req -new -x509 -days 365 -nodes \
#             -out /etc/haproxy/certs/haproxy.pem -keyout /etc/haproxy/certs/haproxy.pem
#           sudo chmod 600 /etc/haproxy/certs/haproxy.pem

global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048
    user haproxy
    group haproxy

    # Runtime API socket for `echo "show stat" | socat /run/haproxy/admin.sock -`
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    retries 3

frontend http_front
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/haproxy.pem
    http-request redirect scheme https unless { ssl_fc }

    # Baseline security headers
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    default_backend app_servers

backend app_servers
    balance roundrobin
    # Optional deeper check — enable once nginx on app1/app2 proxies /healthz to the FastAPI backend:
    # option httpchk GET /healthz
    server app1 192.168.1.14:8080 check inter 2s fall 3 rise 2
    server app2 192.168.1.15:8080 check inter 2s fall 3 rise 2

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    # CHANGE THIS on both load balancers — 8404 must never be reachable unauthenticated from the LAN
    stats auth admin:ChangeMe-LB-Stats
