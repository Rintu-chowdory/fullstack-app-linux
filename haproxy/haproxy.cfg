# HAProxy load balancer config (env-driven; see haproxy/README.md)
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    option  http-keep-alive
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout http-request 10s

frontend http_frontend
    bind    *:80
    default_backend app_servers

frontend stats
    bind    *:8404
    stats   enable
    stats   uri /stats
    stats   refresh 5s
    stats   auth ${STATS_USER}:${STATS_PASSWORD}

backend app_servers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server app1 ${APP1_HOST}:3000 check inter 2s fall 3 rise 2
    server app2 ${APP2_HOST}:3000 check inter 2s fall 3 rise 2
