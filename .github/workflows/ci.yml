name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: dipti_portal
          MYSQL_USER: dipti
          MYSQL_PASSWORD: cipass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      JWT_SECRET: ci-secret-not-used-in-prod
      ADMIN_PASSWORD: ci-admin-pass
      DATABASE_URL: mysql+pymysql://dipti:cipass@127.0.0.1:3306/dipti_portal?charset=utf8mb4
      UPLOAD_DIR: /tmp/dipti-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check backend/app.py backend/database.py backend/models.py backend/alembic/env.py backend/tests
      - name: Wait for MariaDB
        timeout-minutes: 2
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent 2>/dev/null; then
              echo "db ready"; exit 0
            fi
            sleep 2
          done
          echo "DB never became ready"; exit 1
      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Tests (pytest)
        working-directory: backend
        run: python -m pytest tests -q
      - name: Smoke test against MariaDB
        working-directory: backend
        run: |
          nohup python -m uvicorn app:app --port 8000 >/tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz || { echo "backend did not start"; cat /tmp/uvicorn.log; exit 1; }
          curl -fsS http://127.0.0.1:8000/readyz || { echo "db check failed"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret-not-used-in-prod
      SESSION_SECRET: ci-session-secret
      ADMIN_PASSWORD: ci-admin-pass
      DB_PASSWORD: cipass
    steps:
      - uses: actions/checkout@v4
      - name: Start full dev stack
        run: docker compose up --build -d
      - name: Wait for frontend
        timeout-minutes: 3
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$code" = "200" ] && { echo "stack up"; exit 0; }
            sleep 2
          done
          echo "stack did not come up (last healthz code: $code)"
          docker compose ps
          echo "--- backend logs ---"; docker compose logs --no-color --tail 40 backend
          echo "--- frontend logs ---"; docker compose logs --no-color --tail 40 frontend
          exit 1
      - name: Student journey (register + login + profile)
        run: |
          python -c "import base64; open('/tmp/p.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))"
          curl -s -c /tmp/jar -o /dev/null http://127.0.0.1:3000/student/register
          CSRF=$(curl -s -b /tmp/jar -c /tmp/jar http://127.0.0.1:3000/student/register | grep -o 'name="_csrf" value="[^"]*"' | sed 's/.*value="//;s/"//')
          curl -sf -b /tmp/jar -c /tmp/jar -o /dev/null -X POST http://127.0.0.1:3000/student/register \
            -F "_csrf=$CSRF" -F "name=CI Student" -F "institute=DIPTI" -F "batch=B1" \
            -F "course_name=Linux" -F "module=M1" -F "email=ci@example.com" -F "password=password123" \
            -F "photo=@/tmp/p.png;type=image/png" || { echo "register failed"; exit 1; }
          CSRF=$(curl -s -b /tmp/jar -c /tmp/jar http://127.0.0.1:3000/student/login | grep -o 'name="_csrf" value="[^"]*"' | sed 's/.*value="//;s/"//')
          curl -sf -b /tmp/jar -c /tmp/jar -o /dev/null -X POST http://127.0.0.1:3000/student/login \
            --data-urlencode "_csrf=$CSRF" --data-urlencode "email=ci@example.com" --data-urlencode "password=password123" \
            || { echo "login failed"; exit 1; }
          curl -sf -b /tmp/jar http://127.0.0.1:3000/student/profile | grep -q "CI Student" || { echo "profile missing"; exit 1; }
      - name: Teardown
        if: always()
        run: docker compose down -v
