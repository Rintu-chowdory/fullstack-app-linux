name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: dipti_portal
          MYSQL_USER: dipti
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root -prootpass" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend deps
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MariaDB to be available
        run: |
          echo "Waiting for DB on 127.0.0.1:3306..."
          for i in {1..60}; do (</dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && { echo "db ready"; break; } || sleep 1; done

      - name: Start backend and smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: dipti
          DB_PASSWORD: changeme
          DB_NAME: dipti_portal
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-secret-for-tests' }}
          ADMIN_PASSWORD: ci-admin-password
        run: |
          cd backend
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1; done

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Start frontend and smoke test
        run: |
          cd frontend
          nohup npm start &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000 && break || sleep 1; done

      - name: API smoke test (login, admin create, register, student flow)
        env:
          JWT_SECRET: ci-only-secret-for-tests
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: dipti
          DB_PASSWORD: changeme
          DB_NAME: dipti_portal
        run: |
          set -e
          cd backend
          python - <<'PY'
          from PIL import Image
          Image.new("RGB", (64, 64), "green").save("/tmp/photo.png")
          PY
          # admin login
          ADMIN_TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "admin login OK"
          # admin creates a student submission (auth required)
          curl -fsS -X POST http://127.0.0.1:8000/api/students \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"Test","institute":"ITCS","batch":"2026","course_name":"Linux","module":"HA","email":"test@example.com"}'
          echo "admin create OK"
          # unauthenticated create must be rejected
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/students \
            -H 'Content-Type: application/json' -d '{"name":"x","institute":"x","batch":"x","course_name":"x","module":"x","email":"x@x.de"}')
          [ "$CODE" = "401" ] || { echo "expected 401 without token, got $CODE"; exit 1; }
          echo "auth rejection OK"
          # student registration with photo
          curl -fsS -X POST http://127.0.0.1:8000/api/students/register \
            -F 'name=Rintu Test' -F 'institute=ITCS' -F 'batch=2026' -F 'course_name=Linux' \
            -F 'module=HA' -F 'email=student@example.com' -F 'password=supersecret123' \
            -F 'photo=@/tmp/photo.png;type=image/png'
          echo "student registration OK"
          # student login + me
          STU_TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/student/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"student@example.com","password":"supersecret123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS http://127.0.0.1:8000/api/student/me -H "Authorization: Bearer $STU_TOKEN" | grep -q '"name":"Rintu Test"'
          echo "student login + me OK"

      - name: Safety check (optional)
        run: |
          python -m pip install safety
          safety check || true
